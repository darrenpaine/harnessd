[project]
name = "harnessd"
version = "0.1.0"
description = "A base for AI agent usage, with an example Python/FastAPI code project."
readme = "README.md"
authors = [
    { name = "Darren Paine", email = "darren_paine@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-redis>=0.6.0",
    "openinference-instrumentation-langchain>=0.1.82",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
harnessd = "harnessd:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = [".", "src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spec(spec_id, *ids): link a test to spec behaviors, e.g. spec(\"SPEC-0001\", \"B-0002\")",
    "redis: needs a real Redis (skips locally if unreachable, fails in CI)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tavily", "tavily.*", "redisvl.*"]
ignore_missing_imports = true  # ship no type hints

[tool.uv]
package = false  # an app, not installable

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
