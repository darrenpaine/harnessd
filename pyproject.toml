[project]
name = "harnessd"
version = "0.1.0"
description = "A base for AI agent usage, with an example Python/FastAPI code project."
readme = "README.md"
authors = [
    { name = "Darren Paine", email = "darren_paine@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
harnessd = "harnessd:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
