# Weekly version updates (threat model T-31). Minor and patch updates are grouped
# into one pull request per ecosystem; major updates come one per pull request.
version: 2
updates:
  - package-ecosystem: uv  # pyproject.toml and uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions  # .github/workflows/
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker  # the Dockerfile's base image
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The project targets one Python version (pyproject.toml, .python-version
      # and CI), so the image moves to a new one by hand, with them.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: pre-commit  # hook revisions, such as gitleaks
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
